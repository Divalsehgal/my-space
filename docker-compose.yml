services:
  # Development Environment
  dev:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ENV=development
    restart: always

  # Staging Environment (Built for production-like testing)
  staging:
    build:
      context: .
      target: runner
      args:
        - NEXT_PUBLIC_ENV=staging
      secrets:
        - webenv
    ports:
      - "3002:3000"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      - NODE_ENV=production
    restart: always

  # Production-like local test
  production:
    build:
      context: .
      target: runner
      args:
        - NEXT_PUBLIC_ENV=production
      secrets:
        - webenv
    ports:
      - "3003:3000"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      - NODE_ENV=production
    restart: always

# Build-time Contentful credentials, mounted only for the build step (never
# stored in an image layer). See the builder stage in Dockerfile.
secrets:
  webenv:
    file: apps/web/.env

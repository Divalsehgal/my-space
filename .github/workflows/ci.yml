name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --ignore-scripts: dependency lifecycle scripts never run in CI. None
      # are needed — native binaries (esbuild, workerd, …) ship as optional
      # platform packages.
      - run: yarn install --frozen-lockfile --ignore-scripts

      # Fail fast if a secret holds the wrong kind of Contentful token (e.g. a
      # read/write management token in CONTENTFUL_ACCESS_TOKEN).
      - name: Verify Contentful tokens
        run: yarn workspace web contentful:check-tokens
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      # src/i18n/translations is gitignored and generated from Contentful;
      # typecheck and tests import it.
      - run: yarn workspace web translations
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - run: yarn lint
      - run: yarn lint:style
      - run: yarn typecheck

      # Writes <workspace>/coverage/lcov.info for every tested workspace
      # (referenced by sonar-project.properties); the sonarqube job reuses
      # them instead of running the suite a second time.
      - run: yarn test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --ignore-scripts: dependency lifecycle scripts never run in CI. None
      # are needed — native binaries (esbuild, workerd, …) ship as optional
      # platform packages.
      - run: yarn install --frozen-lockfile --ignore-scripts

      # Requires CONTENTFUL_SPACE_ID, CONTENTFUL_ACCESS_TOKEN and
      # CONTENTFUL_PREVIEW_ACCESS_TOKEN set as repo secrets (Settings ->
      # Secrets and variables -> Actions) — pages are statically generated
      # from live Contentful data at build time.
      - run: yarn build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      # End-to-end tests against the production build just made (desktop and
      # mobile Chrome). The server re-reads Contentful at runtime, so it needs
      # the same secrets as the build.
      # Runs the locked @playwright/test devDependency's CLI rather than
      # letting npx fetch an unpinned package.
      - run: yarn playwright install --with-deps chromium
        working-directory: apps/web

      - run: yarn workspace web test:e2e
        env:
          CI: true
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: verify
    # Secrets aren't available to PRs from forks or to Dependabot, so the scan
    # would only fail there; it still runs (and must pass) on main and on PRs
    # opened from this repo.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube Cloud uses full git history for blame/new-code data.
          fetch-depth: 0

      - name: Check SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set. Generate a token at sonarcloud.io (My Account -> Security) and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Installed so the TypeScript analyzer can resolve imported types.
      # --ignore-scripts: dependency lifecycle scripts never run in CI.
      - run: yarn install --frozen-lockfile --ignore-scripts

      # Coverage reports written by the verify job.
      - uses: actions/download-artifact@v4
        with:
          name: coverage

      # Project settings live in sonar-project.properties. Automatic Analysis
      # must be disabled in SonarQube Cloud for this CI-based scan to be accepted.
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

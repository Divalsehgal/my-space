# SonarQube Cloud configuration — https://sonarcloud.io
# Replace sonar.organization and sonar.projectKey with the values SonarQube
# Cloud assigns when you import this repo (Settings shown on the project
# page after import).
sonar.organization=CHANGEME
sonar.projectKey=CHANGEME

sonar.sourceEncoding=UTF-8

# Monorepo: analyze app/package source, skip build output and deps.
sonar.sources=apps/web/src,apps/contentful-quiz-app/src,packages
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/build-tokens.js

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

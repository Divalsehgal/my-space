# SonarQube Cloud configuration — https://sonarcloud.io
# Analysis runs in CI (.github/workflows/ci.yml, job "sonarqube"). Automatic
# Analysis must be OFF in the project's Administration -> Analysis Method,
# otherwise CI scans are rejected and this file is ignored.
sonar.organization=divalsehgal
sonar.projectKey=Divalsehgal_my-space

sonar.sourceEncoding=UTF-8

# Monorepo: analyze app/package source, skip build output and deps.
sonar.sources=apps/web/src,apps/contentful-quiz-app/src,packages
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/build-tokens.js

# Test code: analysed with test rules and kept out of coverage/duplication.
# Covers both naming styles in the repo: foo.test.ts and <component>/test.tsx.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test.ts,\
  **/test.tsx,\
  **/__tests__/**,\
  **/test-mocks/**,\
  **/test-utils/**

# Tooling config and generated code: nothing meaningful to unit test.
sonar.coverage.exclusions=\
  **/*.config.*,\
  **/jest.config.*,\
  packages/eslint-config/**,\
  packages/jest-config/**,\
  packages/stylelint-config/**,\
  packages/tsconfig/**,\
  apps/web/src/generated/**

# One lcov report per tested workspace, written by `yarn test:coverage` with
# repo-root-relative paths (packages/jest-config/coverage.js).
sonar.javascript.lcov.reportPaths=\
  apps/web/coverage/lcov.info,\
  apps/contentful-quiz-app/coverage/lcov.info,\
  packages/ui/coverage/lcov.info,\
  packages/utils/coverage/lcov.info,\
  packages/quiz/coverage/lcov.info
